<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern Islamic (Hijri) calendar based on the Umm al-Qura calendar of Saudi Arabia, with the sacred days, blessed nights, fasting days and authentic hadiths for each occasion. Bilingual English / Arabic, light & dark.">
  <meta name="theme-color" content="#0a1722">
  <title>Islamic Calendar | التقويم الإسلامي</title>

  <!-- Avoid theme/direction flash before CSS paints -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ic-theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('ic-lang') || 'en';
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ── Header ─────────────────────────────────────────── -->
    <header class="app-header">
      <div class="geo-pattern"></div>

      <!-- Theme + language controls -->
      <div class="app-controls">
        <button class="ctrl-btn" id="themeToggle" type="button" aria-label="Toggle theme">
          <span class="ic" id="themeIcon">☾</span>
        </button>
        <button class="ctrl-btn" id="langToggle" type="button" aria-label="Switch language">
          <span id="langLabel">العربية</span>
        </button>
      </div>

      <div class="header-content">
        <p class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
        <h1>
          <span class="title-arabic">التقويم الإسلامي</span>
          <span class="title-sep">✦</span>
          <span class="title-english">Islamic Calendar</span>
        </h1>
        <p class="header-sub" data-i18n="headerSub">Sacred Days &amp; Blessed Times</p>
      </div>

      <div class="today-banner" id="todayBanner"></div>

      <!-- View switch -->
      <div class="view-switch" role="tablist" aria-label="Calendar view">
        <button class="seg-btn active" id="viewMonthBtn" data-view="month" type="button" data-i18n="viewMonth">Month</button>
        <button class="seg-btn" id="viewYearBtn" data-view="year" type="button" data-i18n="viewYear">Year</button>
      </div>
    </header>

    <!-- ── Browser notice ─────────────────────────────────── -->
    <div class="notice-bar" id="noticeBar" hidden>
      <span class="notice-icon">⚠️</span>
      <span id="noticeText" data-i18n="notice"></span>
    </div>

    <!-- ── Main Layout ────────────────────────────────────── -->
    <main class="app-main" id="appMain">

      <!-- ===== MONTH VIEW ===== -->
      <section class="calendar-section" id="monthView">

        <nav class="cal-nav">
          <button class="nav-btn" id="prevMonth" type="button">&#8249;</button>
          <div class="nav-info">
            <div class="nav-hijri" id="navHijri"></div>
            <div class="nav-gregorian" id="navGregorian"></div>
          </div>
          <button class="nav-btn" id="nextMonth" type="button">&#8250;</button>
        </nav>

        <div class="cal-actions">
          <button class="btn-today" id="btnToday" type="button">⌂ <span data-i18n="today">Today</span></button>
          <div class="legend" id="legend"></div>
        </div>

        <div class="calendar-grid">
          <div class="cal-weekdays" id="calWeekdays"></div>
          <div class="cal-days" id="calDays"></div>
        </div>

        <p class="cal-disclaimer" data-i18n-html="disclaimer"></p>
      </section>

      <!-- ===== SIDEBAR ===== -->
      <aside class="sidebar" id="sidebar">

        <div class="sidebar-card">
          <h2 class="sidebar-title" id="upcomingTitle"></h2>
          <div id="upcomingList" class="upcoming-list"></div>
        </div>

        <div class="sidebar-card">
          <h2 class="sidebar-title" id="weeklyTitle"></h2>
          <div class="weekly-info" id="weeklyInfo"></div>
        </div>

        <div class="sidebar-card" id="monthCard"></div>

      </aside>

      <!-- ===== YEAR VIEW ===== -->
      <section class="year-section" id="yearView" hidden>
        <div class="year-nav">
          <button class="nav-btn" id="prevYear" type="button">&#8249;</button>
          <div class="year-title" id="yearTitle"></div>
          <button class="nav-btn" id="nextYear" type="button">&#8250;</button>
          <button class="btn-today" id="btnThisYear" type="button"></button>
          <div class="legend" id="yearLegend"></div>
          <div class="year-hint" id="yearHint"></div>
        </div>
        <div class="year-track" id="yearTrack"></div>
      </section>

    </main>
  </div>

  <!-- ── Detail Modal ────────────────────────────────────── -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-box" id="modalBox">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="js/hijri.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
