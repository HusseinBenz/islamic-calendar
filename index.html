<!DOCTYPE html>
<html lang="en" dir="ltr" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A modern Islamic (Hijri) calendar based on the Umm al-Qura calendar of Saudi Arabia, with the sacred days, blessed nights, fasting days and authentic hadiths for each occasion. Bilingual English / Arabic, day & night.">
  <meta name="theme-color" content="#F6F4EE">
  <title>Islamic Calendar | التقويم الإسلامي</title>

  <!-- Theme (shared across all Islamic Projects) + language, set before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sakina-theme') || localStorage.getItem('ic-theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('sakina-lang') || localStorage.getItem('ic-lang') || 'en';
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
        document.documentElement.setAttribute('data-lang', l === 'ar' ? 'ar' : 'en');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233456C8' d='M23 12L19.78 15.22L19.78 19.78L15.22 19.78L12 23L8.78 19.78L4.22 19.78L4.22 15.22L1 12L4.22 8.78L4.22 4.22L8.78 4.22L12 1L15.22 4.22L19.78 4.22L19.78 8.78Z'/%3E%3Ccircle cx='12' cy='12' r='4.4' fill='%23F6F4EE'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sakina.css?v=sk3">
  <link rel="stylesheet" href="css/style.css?v=sk3">
</head>
<body class="sk-project-cal">
  <a class="sk-skip" href="#appMain">Skip to calendar</a>
  <div class="sk-pattern" aria-hidden="true"></div>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header class="sk-header">
    <div class="sk-container sk-header__inner">
      <a class="sk-brand" href="./">
        <span class="sk-tile sk-tile--sm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/><path d="M19 2v4M17 4h4"/></svg></span>
        <span class="sk-brand__text"><span class="sk-brand__name"><span class="en">Islamic Calendar</span><span class="ar">التقويم الإسلامي</span></span><span class="sk-brand__sub"><span class="en" lang="ar">التقويم الإسلامي</span><span class="ar" lang="en">Islamic Calendar</span></span></span>
      </a>
      <nav class="sk-header__nav app-controls" aria-label="Calendar controls">
        <div class="view-switch" role="tablist" aria-label="Calendar view">
          <button class="seg-btn active" id="viewMonthBtn" data-view="month" type="button" role="tab" aria-selected="true" data-i18n="viewMonth">Month</button>
          <button class="seg-btn" id="viewYearBtn" data-view="year" type="button" role="tab" aria-selected="false" data-i18n="viewYear">Year</button>
        </div>
        <button class="sk-btn sk-btn--ghost sk-btn--sm lang-btn" id="langToggle" type="button" aria-label="Switch language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          <span id="langLabel">العربية</span>
        </button>
        <button class="sk-btn sk-btn--ghost sk-btn--sm sk-digits-btn" type="button" data-sk-digits-toggle aria-pressed="false"><span class="d-arab" data-digits="keep">١٢٣</span><span class="d-latn" data-digits="keep">123</span></button>
        <a class="sk-btn sk-btn--line sk-btn--sm sk-projects" id="projectsLink" href="https://husseinbenz.github.io/islamic-projects/" aria-label="All Islamic projects">
          <span class="sk-constellation" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="sk-hide-sm" id="projectsLabel">All projects</span></a>
        <button class="sk-icon-btn sk-theme-btn" id="themeToggle" type="button" data-sk-theme-toggle aria-label="Toggle theme">
          <svg class="sk-i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="sk-i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="sk-container cal-page">
    <!-- ── Browser notice ─────────────────────────────────── -->
    <div class="notice-bar" id="noticeBar" role="status" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span id="noticeText" data-i18n="notice"></span>
    </div>

    <!-- ── Today ──────────────────────────────────────────── -->
    <section class="today sk-rise" id="todayBanner" aria-live="polite"></section>

    <!-- ── Main Layout ────────────────────────────────────── -->
    <div class="app-main" id="appMain">

      <!-- ===== MONTH VIEW ===== -->
      <section class="calendar-section sk-card sk-rise sk-d1" id="monthView" aria-label="Month">
        <nav class="cal-nav">
          <button class="nav-btn sk-icon-btn" id="prevMonth" type="button"></button>
          <div class="nav-info">
            <h2 class="nav-hijri sk-display" id="navHijri"></h2>
            <div class="nav-gregorian" id="navGregorian"></div>
          </div>
          <button class="nav-btn sk-icon-btn" id="nextMonth" type="button"></button>
          <button class="btn-today sk-btn sk-btn--soft sk-btn--sm" id="btnToday" type="button">
            <svg width="15" height="15" viewBox="-12 -12 24 24" aria-hidden="true"><path fill="currentColor" d="M11 0L7.78 3.22L7.78 7.78L3.22 7.78L0 11L-3.22 7.78L-7.78 7.78L-7.78 3.22L-11 0L-7.78 -3.22L-7.78 -7.78L-3.22 -7.78L0 -11L3.22 -7.78L7.78 -7.78L7.78 -3.22Z"/></svg>
            <span data-i18n="today">Today</span></button>
        </nav>

        <div class="cal-actions">
          <div class="legend" id="legend"></div>
        </div>

        <div class="calendar-grid">
          <div class="cal-weekdays" id="calWeekdays"></div>
          <div class="cal-days" id="calDays"></div>
        </div>

        <p class="cal-disclaimer" data-i18n-html="disclaimer"></p>
      </section>

      <!-- ===== SIDEBAR ===== -->
      <aside class="sidebar sk-rise sk-d2" id="sidebar">
        <div class="sidebar-card sk-card">
          <h2 class="sidebar-title" id="upcomingTitle"></h2>
          <div id="upcomingList" class="upcoming-list"></div>
        </div>
        <div class="sidebar-card sk-card">
          <h2 class="sidebar-title" id="weeklyTitle"></h2>
          <div class="weekly-info" id="weeklyInfo"></div>
        </div>
        <div class="sidebar-card sk-card" id="monthCard"></div>
      </aside>

      <!-- ===== YEAR VIEW ===== -->
      <section class="year-section sk-card" id="yearView" hidden>
        <div class="year-nav">
          <button class="nav-btn sk-icon-btn" id="prevYear" type="button"></button>
          <h2 class="year-title sk-display" id="yearTitle"></h2>
          <button class="nav-btn sk-icon-btn" id="nextYear" type="button"></button>
          <button class="btn-today sk-btn sk-btn--soft sk-btn--sm" id="btnThisYear" type="button"></button>
          <div class="legend" id="yearLegend"></div>
          <div class="year-hint" id="yearHint"></div>
        </div>
        <div class="year-track" id="yearTrack"></div>
      </section>
    </div>
  </main>

  <footer class="sk-footer">
    <div class="sk-container sk-footer__inner">
      <p><span class="en">Umm al-Qura calculation · English / <span lang="ar">العربية</span> · Day &amp; Night</span><span class="ar">حساب أم القرى · العربية / <span lang="en">English</span> · نهاري وليلي</span></p>
      <a class="sk-footer__home" href="https://husseinbenz.github.io/islamic-projects/">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--primary)" d="M23 12L19.78 15.22L19.78 19.78L15.22 19.78L12 23L8.78 19.78L4.22 19.78L4.22 15.22L1 12L4.22 8.78L4.22 4.22L8.78 4.22L12 1L15.22 4.22L19.78 4.22L19.78 8.78Z"/><circle cx="12" cy="12" r="4.4" style="fill:var(--bg)"/></svg>
        <span class="en">Part of Islamic Projects</span><span class="ar">من المشاريع الإسلامية</span></a>
    </div>
  </footer>

  <!-- ── Detail Modal ────────────────────────────────────── -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-box" id="modalBox">
      <button class="modal-close sk-icon-btn" id="modalClose" type="button" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="js/sakina.js?v=sk3"></script>
  <script src="js/hijri.js?v=sk3"></script>
  <script src="js/i18n.js?v=sk3"></script>
  <script src="js/data.js?v=sk3"></script>
  <script src="js/app.js?v=sk3"></script>
</body>
</html>
